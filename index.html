<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<title>Mon site</title>

<style>

body{
    margin:0;
    background:#fafafa;
    font-family:Arial, sans-serif;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
}

.onglet{
    width:340px;
    background:white;
    border:1px solid #dbdbdb;
    border-radius:12px;
    padding:40px;
    text-align:center;
}

.logo{
    width:170px;
    display:block;
    margin:0 auto 25px auto;
}

input{
    width:100%;
    box-sizing:border-box;
    padding:12px;
    margin-bottom:10px;
    border:1px solid #dbdbdb;
    border-radius:8px;
    background:#fafafa;
    font-size:14px;
}

button{
    width:100%;
    padding:12px;
    border:none;
    border-radius:8px;
    background:#0095f6;
    color:white;
    font-size:16px;
    font-weight:bold;
    cursor:pointer;
}

button:hover{
    background:#1877f2;
}

</style>

</head>

<body>

<div class="onglet">

<img src="instagram-logo-instagram-icon-transparent-free-png.webp" class="logo">

<input type="text" placeholder="Nom d'utilisateur">

<input type="password" placeholder="Mot de passe">

<button>Connexion</button>

</div>

</body>
</html>
